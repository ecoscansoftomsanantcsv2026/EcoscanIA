<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Plasticollection IA</title>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8/dist/teachablemachine-image.min.js"></script>
    
<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:linear-gradient(135deg,#dfffea,#dff3ff,#fff7d6);
    color:#123;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.menu {
  grid-column: span 2; /* Ocupa las dos columnas del contenedor grid */
  width: 100%;
  background: #000152; /* Color oscuro de fondo */
  list-style: none;
  margin: 0; /* Ajustado a 0 para alinearse perfectamente */
  padding: 10px 0;
  text-align: center;
}

.menu li {
  display: inline-block;
  text-align: center;
}

.menu li a {
  padding: 12px 20px;
  color: #ffffff;
  display: inline-block;
  font-family: cursive;
  text-decoration: none; /* Quita el subrayado de los links */
}

.menu li a:hover {
  color: rgb(255, 255, 255); /* Texto blanco al pasar el mouse */
  background: rgb(60, 10, 110); /* Fondo un poco más claro al hacer hover */
  border-radius: 8px;
}
.app{
    width:min(1240px,100%);
    background:rgba(255,255,255,0.92);
    border-radius:28px;
    box-shadow:0 20px 60px rgba(0,0,0,0.18);
    overflow:hidden;
    display:grid;
    grid-template-columns:1fr 1fr;
}

.hero{
    padding:65px;
    background:#65b3fc;
    color:#fcfafa;
}

.hero h1{
    margin: 0;
    padding: 0;
}
#logo img{
	width: 350px;
	height: auto;
	transform: translate(-120px,-80px);

}

.hero p{
    font-size:17px;
    transform: translateY(-100px);
    text-align: center;
}

.mascota{
    display:flex;
    justify-content:flex-start; /* <- esto la mueve a la izquierda */
    align-items:center;
    transform: translate(-60px,-110px);
    margin:10px 0 -80px 0;
}

#mascota{
    width:450px;
    height:auto;
}
.icono-extra{
    font-size:80px;
    transform: translateX(-80px);
}
.panel{
    padding:32px;
}
#mensaje{
	margin-top: 0;
}
button{
    border:none;
    border-radius:18px;
    padding:14px 20px;
    background:#3737c4;
    color:#e9e9f7;
    font-weight:bold;
    font-size:16px;
    cursor:pointer;
}

button:hover{
    transform:scale(1.03);
}

#webcam-container canvas{
    width:100%;
    max-width:360px;
    border-radius:22px;
    border:6px solid #e7f7ee;
    margin-top:18px;
}

.resultado{
    margin-top:18px;
    padding:22px;
    border-radius:24px;
    background:#e3e4e6;
    border:2px solid #e5e8ef;
}

.barra{
    height:18px;
    background:#ddd;
    border-radius:20px;
    overflow:hidden;
    margin:10px 0 14px;
}

.relleno{
    height:100%;
    width:0%;
    background:#0f7b4f;
}
.icono-categoria{
    width:60px;
    height:60px;
    object-fit:contain;
    vertical-align:middle;
    margin-right:8px;
}

@media(max-width:760px){
    .app{
        grid-template-columns:1fr;
    }
    .menu {
        grid-column: span 1; /* En móviles se adapta a una sola columna */
    }
}

</style>
</head>

<body>

<main class="app">

<nav style="grid-column: span 2; width: 100%;">
  <ul class="menu">
    <li><a href="#inicio">Artículo</a></li>
    <li><a href="https://ecoscansoftomsanantcsv2026.github.io/EcoscanIA/">Herramienta</a></li>
    <li><a href="https://ecoscansoftomsanantcsv2026.github.io/EcoscanIA/mejorarplastic.html">Ayúdanos a mejorar</a></li>
  
  </ul>
</nav>

<section class="hero">

<h1>
<div id="logo">
<img src="img/logo.png">	
</div>
</h1>

<p>
Apunta la cámara a un residuo y descubre datos curiosos sobre este.
</p>

<div class="mascota">
    <img id="mascota"
         src="img/mascota.png"
    >

    <span class="icono-extra">♻️</span>
</div>

<div id="mensaje">Plasticollection está listo.</div>

</p>

</section>

<section class="panel">

<button onclick="init()">
Iniciar Plasticollection
</button>

<div id="webcam-container"></div>

<div class="resultado" id="resultado">

<h2 id="categoria">
Esperando residuo...
</h2>

<div id="contenedor">
Presiona Iniciar.
</div>

<div class="barra">
<div class="relleno" id="relleno"></div>
</div>

<div id="confianza">
Confianza: 0%
</div>


</div>

</section>

</main>

<script>

const URL = "https://teachablemachine.withgoogle.com/models/LM5d7204-/";
// ejemplo:
// https://teachablemachine.withgoogle.com/models/abc123/

let model;
let webcam;
let puntos = 0;
let ultimaCategoria = "";

let ultimoCambioUI = 0;
const INTERVALO_UI = 500; // 0.5 segundos

const datos = {

    "Cubiertos plásticos":{
        color:"#5481eb",
        icono:"img/cubierto.png",
        contenedor:"Contenedor plástico",
        mensaje:"cubierto."
    },

    "Tapas":{
        color:"#23cf43",
        icono:"img/tapa.png",
        contenedor:"Contenedor papel",
        mensaje:"tapa."
    },

    "Botellas":{
        color:"#c4c72e",
        icono:"img/botella.png",
        contenedor:"Contenedor vidrio",
        mensaje:"Botella"
    },

    "Bolsas":{
        color:"#eb7c44",
        icono:"img/bolsa.png",
        contenedor:"Contenedor vidrio",
        mensaje:"bolsa."
    },

    "Vasos":{
        color:"#b734e3",
        icono:"img/vaso.png",
        contenedor:"Contenedor vidrio",
        mensaje:"vaso."
    },

    "Platos":{
        color:"#ed1818",
        icono:"img/plato.png",
        contenedor:"Contenedor vidrio",
        mensaje:"plato"
    }

};

async function init(){

    try{

        console.log("Iniciando...");

        const modelURL = URL + "model.json";
        const metadataURL = URL + "metadata.json";

        console.log("Modelo:", modelURL);
        console.log("Metadata:", metadataURL);

        model = await tmImage.load(modelURL, metadataURL);

        console.log("Modelo cargado");

        webcam = new tmImage.Webcam(320,320,true);

        console.log("Solicitando cámara...");

        await webcam.setup();

        console.log("Permiso concedido");

        await webcam.play();

        console.log("Cámara iniciada");

        document.getElementById("webcam-container").innerHTML = "";

        document
            .getElementById("webcam-container")
            .appendChild(webcam.canvas);

        window.requestAnimationFrame(loop);

    }catch(error){

        console.error("ERROR REAL:", error);

        alert(error.message);
    }
}

async function loop(){

    webcam.update();

    await predict();

    window.requestAnimationFrame(loop);
}

async function predict(){

    const prediction = await model.predict(webcam.canvas);

    prediction.sort((a,b)=>b.probability-a.probability);

    const mejor = prediction[0];

    const categoria = mejor.className;

    const confianza = Math.round(mejor.probability * 100);

    if(confianza < 65){

        mostrarResultado(
            "Duda",
            confianza,
            {
                color:"#ff6b6b",
                icono:"img/duda.png",
                contenedor:"No estoy seguro",
                mensaje:"Mejora la luz o acerca el objeto."
            }
        );

        return;
    }

    const info = datos[categoria] || {

    color:"#0f7b4f",
    icono:"♻️",
    contenedor:"Categoría detectada",
    mensaje:"Revisa las normas de reciclaje."

	};	

	const ahora = Date.now();

	if(ahora - ultimoCambioUI >= INTERVALO_UI){

    	mostrarResultado(categoria, confianza, info);

    	ultimoCambioUI = ahora;

    	if(categoria !== ultimaCategoria && confianza >= 80){

        	puntos++;

        	ultimaCategoria = categoria;
    	}
	}

}


function mostrarResultado(categoria, confianza, info){

    document.getElementById("categoria").innerHTML =
    `<img src="${info.icono}" class="icono-categoria">
     ${categoria}`;

    document.getElementById("contenedor").innerText =
        info.contenedor;

    document.getElementById("confianza").innerText =
        "Confianza: " + confianza + "%";

    document.getElementById("relleno").style.width =
        confianza + "%";

    document.getElementById("relleno").style.background =
        info.color;

    document.getElementById("mensaje").innerText =
        info.mensaje;

    document.getElementById("mascota").innerText =
        confianza >= 80 ? "🤖♻️" : "🤖🔎";
}

</script>

</body>
</html>
