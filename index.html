<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Plasticollection IA</title>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8/dist/teachablemachine-image.min.js"></script>
    
<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:linear-gradient(135deg,#dfffea,#dff3ff,#fff7d6);
    color:#123;
    min-height:80vh;
    display:flex;
    flex-direction: column;
    justify-content:center;
    align-items:center;
    padding-bottom: 10px;
}


header {
            background: linear-gradient(135deg, #007cf0  0%, #00dfd8 100%);
            padding: 3.5rem 1rem;
            color: white;
            border-bottom-left-radius: 60px;
            border-bottom-right-radius: 60px;
            box-shadow: 0 10px 30px rgba(0, 124, 240, 0.2);
            position: relative;
        }

        header h1 {
            font-size: 3rem;
            font-weight: 800;
            margin-bottom: 5px;
            text-align: center;
        }
        header,
        nav{
            width: 100%;
        }
        header img {
            width: 350px;
            text-align: left;
            position: absolute;
            transform: translateY(-60px);
        }
nav {
            margin: -30px auto 0;
            max-width: 750px; /* Un poco más ancha para los dos botones */
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(15px);
            padding: 20px;
            border-radius: 25px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px; /* Espacio entre botones */
            box-shadow: 0 15px 35px rgba(0,0,0,0.08);
            position: sticky;
            top: 20px;
            z-index: 1000;
            border: 1px solid rgba(255, 255, 255, 0.5);
        }
        nav ul{
    list-style:none;
    margin:0;
    padding:0;

    display:flex;      /* coloca los li en fila */
    flex-direction:row;
    gap:15px;

    align-items:center;
    justify-content:center;
}

nav li{
    margin:0;
}

        .nav-link {
            padding: 12px 25px;
            text-decoration: none;
            font-weight: 600;
            border-radius: 15px;
            font-size: 1rem;
            transition: all 0.3s ease;
            text-align: center;
        }
        .btn-encuesta {
            background: linear-gradient(90deg, #00c6ff 0%, #0072ff 100%);
            color: white;
            box-shadow: 0 5px 15px rgba(0, 114, 255, 0.3);
        }

        .btn-encuesta:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0, 114, 255, 0.5);
            filter: brightness(1.1);
        }
.app{
    width:min(1340px,100%);
    background:rgba(255,255,255,0.92);
    border-radius:28px;
    box-shadow:0 20px 60px rgba(0,0,0,0.18);
    overflow:hidden;
    display:grid;
    grid-template-columns:1fr 1fr;
    margin-top: 20px;
}

.hero{
    padding:60px;
    background:#009dff;
    color:#fcfafa;
}

#logo img{
	width: 350px;
	height: auto;
	transform: translate(-120px,-80px);

}

.hero p{
    font-size:24px;
    text-align: center;
    margin-top: 10px
}

.mascota{
    display:flex;
    justify-content:flex-start; /* <- esto la mueve a la izquierda */
    align-items:center;
    margin:20px 0;
}

#mascota{
    width:450px;
    height:auto;
}
.icono-extra{
    font-size:80px;
    transform: translateX(-80px);
}
.panel{
    padding:32px;
}
#mensaje{
	margin-top: 0;
	font-size: 24px
}
button{
    border:none;
    border-radius:18px;
    padding:14px 20px;
    background: linear-gradient(90deg, #00c6ff 0%, #0072ff 100%);
    color:#e9e9f7;
    font-weight:bold;
    font-size:16px;
    cursor:pointer;
}

button:hover{
    transform:scale(1.03);
}

#webcam-container canvas{
    width:100%;
    max-width:360px;
    border-radius:22px;
    border:6px solid #e7f7ee;
    margin-top:18px;
}

.resultado{
    margin-top:18px;
    padding:22px;
    border-radius:24px;
    background:#e3e4e6;
    border:2px solid #e5e8ef;
}

.barra{
    height:18px;
    background:#ddd;
    border-radius:20px;
    overflow:hidden;
    margin:10px 0 14px;
}

.relleno{
    height:100%;
    width:0%;
    background:#0f7b4f;
}
.icono-categoria{
    width:60px;
    height:60px;
    object-fit:contain;
    vertical-align:middle;
    margin-right:8px;
}

@media(max-width:760px){
    .app{
        grid-template-columns:1fr;
    }
    .menu {
        grid-column: span 1; /* En móviles se adapta a una sola columna */
    }
}

</style>
</head>

<body>

<header>
    <img src="img/logo.png">
    <h1>¡Bienvenido a Plasticollection!</h1>
</header>

<nav>
  <ul>
    <li><a href="https://ecoscansoftomsanantcsv2026.github.io/EcoscanIA/articulo.html" class="nav-link btn-encuesta">Instrucciones</a></li>
    <li><a href="https://ecoscansoftomsanantcsv2026.github.io/EcoscanIA/" class="nav-link btn-encuesta">Herramienta</a></li
    ><li><a href="https://ecoscansoftomsanantcsv2026.github.io/EcoscanIA/instrucciones.html" class="nav-link btn-encuesta">Artículo</a></li>
    <li><a href="https://ecoscansoftomsanantcsv2026.github.io/EcoscanIA/mejorarplastic.html" class="nav-link btn-encuesta">Ayúdanos a mejorar</a></li>
  
  </ul>
</nav>

<main class="app">

<section class="hero">


<p>
Apunta la cámara a un residuo y descubre datos curiosos sobre este.


<div class="mascota">
    <img id="mascota"
         src="img/mascota.png"
    >

    <span class="icono-extra">♻️</span>
</div>

<div id="mensaje">Plasticollection está listo.</div>

</p>

</section>

<section class="panel">

<button onclick="init()">
Iniciar Plasticollection
</button>

<div id="webcam-container"></div>

<div class="resultado" id="resultado">

<h2 id="categoria">
Esperando residuo...
</h2>

<div id="contenedor">
Presiona Iniciar.
</div>

<div class="barra">
<div class="relleno" id="relleno"></div>
</div>

<div id="confianza">
Confianza: 0%
</div>


</div>

</section>

</main>

<script>

const URL = "https://teachablemachine.withgoogle.com/models/LM5d7204-/";
// ejemplo:
// https://teachablemachine.withgoogle.com/models/abc123/

let model;
let webcam;
let puntos = 0;
let ultimaCategoria = "";

let ultimoCambioUI = 0;
const INTERVALO_UI = 500; // 0.5 segundos

const datos = {

    "Cubiertos plásticos":{
        color:"#5481eb",
        icono:"img/cubierto.png",
        contenedor:"",
        mensaje:"Procura desecharlos limpios. El plástico recuperado de estos residuos puede aprovecharse para fabricar mobiliario urbano, materas y otros artículos de larga duración."
    },

    "Tapas":{
        color:"#23cf43",
        icono:"img/tapa.png",
        contenedor:"",
        mensaje:"Llévalas a un punto especializado de recolección. El colegio lleva estas tapas a fundaciones que apoyan causas sociales mientras que el material reciclado se transforma en nuevos productos plásticos."
    },

    "Botellas":{
        color:"#c4c72e",
        icono:"img/botella.png",
        contenedor:"",
        mensaje:"Vacía, enjuaga y aplasta la botella antes de reciclarla. En el país, las botellas PET recicladas suelen convertirse en nuevas botellas, fibras para textiles y empaques."
    },

    "Bolsas":{
        color:"#eb7c44",
        icono:"img/bolsa.png",
        contenedor:"",
        mensaje:"Reutilízalas siempre que sea posible antes de desecharlas. Cuando son recicladas, pueden convertirse en nuevas bolsas, madera plástica y elementos para construcción y mobiliario."
    },

    "Vasos":{
        color:"#b734e3",
        icono:"img/vaso.png",
        contenedor:"",
        mensaje:"Límpialo antes de desecharlo. El plástico recuperado de vasos y otros envases puede utilizarse para fabricar nuevos productos plásticos y materiales de uso industrial."
    },

    "Platos":{
        color:"#ed1818",
        icono:"img/plato.png",
        contenedor:"",
        mensaje:"plato"
    }

};

async function init(){

    try{

        console.log("Iniciando...");

        const modelURL = URL + "model.json";
        const metadataURL = URL + "metadata.json";

        console.log("Modelo:", modelURL);
        console.log("Metadata:", metadataURL);

        model = await tmImage.load(modelURL, metadataURL);

        console.log("Modelo cargado");

        webcam = new tmImage.Webcam(320,320,true);

        console.log("Solicitando cámara...");

        await webcam.setup();

        console.log("Permiso concedido");

        await webcam.play();

        console.log("Cámara iniciada");

        document.getElementById("webcam-container").innerHTML = "";

        document
            .getElementById("webcam-container")
            .appendChild(webcam.canvas);

        window.requestAnimationFrame(loop);

    }catch(error){

        console.error("ERROR REAL:", error);

        alert(error.message);
    }
}

async function loop(){

    webcam.update();

    await predict();

    window.requestAnimationFrame(loop);
}

async function predict(){

    const prediction = await model.predict(webcam.canvas);

    prediction.sort((a,b)=>b.probability-a.probability);

    const mejor = prediction[0];

    const categoria = mejor.className;

    const confianza = Math.round(mejor.probability * 100);

    if(confianza < 65){

        mostrarResultado(
            "Duda",
            confianza,
            {
                color:"#ff6b6b",
                icono:"img/duda.png",
                contenedor:"No estoy seguro",
                mensaje:"Mejora la luz o acerca el objeto."
            }
        );

        return;
    }

    const info = datos[categoria] || {

    color:"#0f7b4f",
    icono:"♻️",
    contenedor:"Categoría detectada",
    mensaje:"Revisa las normas de reciclaje."

	};	

	const ahora = Date.now();

	if(ahora - ultimoCambioUI >= INTERVALO_UI){

    	mostrarResultado(categoria, confianza, info);

    	ultimoCambioUI = ahora;

    	if(categoria !== ultimaCategoria && confianza >= 80){

        	puntos++;

        	ultimaCategoria = categoria;
    	}
	}

}


function mostrarResultado(categoria, confianza, info){

    document.getElementById("categoria").innerHTML =
    `<img src="${info.icono}" class="icono-categoria">
     ${categoria}`;

    document.getElementById("contenedor").innerText =
        info.contenedor;

    document.getElementById("confianza").innerText =
        "Confianza: " + confianza + "%";

    document.getElementById("relleno").style.width =
        confianza + "%";

    document.getElementById("relleno").style.background =
        info.color;

    document.getElementById("mensaje").innerText =
        info.mensaje;

	const mascota = document.getElementById("mascota");

if(confianza >= 80){
    mascota.src = "img/mascota.png";
    mascota.style.width = "450px";
}else{
    mascota.src = "img/duda.png";
    mascota.style.width = "220px";
}
}

</script>

</body>
</html>
